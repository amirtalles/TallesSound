<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lost Sound</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Animated Background -->
  <div class="background"></div>

  <main class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        LOST <span>SOUND</span>
      </div>

      <button class="more">•••</button>
    </header>


    <!-- Hero -->
    <section class="hero">

      <div class="eyebrow">
        DISCOVER THE SOUND
      </div>

      <h1>
        Choose an<br>
        <strong>Artist</strong>
      </h1>

      <p>
        آرتیست موردنظر خودت را انتخاب کن
      </p>

    </section>


    <!-- Artists -->
    <section class="artists" id="artists"></section>


  </main>


  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button class="active">
      <span>⌂</span>
      <small>خانه</small>
    </button>

    <button>
      <span>◉</span>
      <small>آرتیست‌ها</small>
    </button>

    <button>
      <span>＋</span>
      <small>آپلود</small>
    </button>

    <button>
      <span>♫</span>
      <small>مای ساند</small>
    </button>

    <button>
      <span>◯</span>
      <small>پروفایل</small>
    </button>

  </nav>


  <!-- Artist Profile -->
  <div class="profile" id="profile">

    <button class="close" id="close">
      ×
    </button>

    <div
      class="profile-cover"
      id="profileCover">
    </div>

    <div class="eyebrow">
      ARTIST
    </div>

    <h2 id="profileName">
      Artist
    </h2>

    <p id="profileBio">
      Music creator on Lost Sound.
    </p>

    <button class="upload-button">
      UPLOAD TRACK
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
