<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TallesSound Studio</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="studio">
<div class="logo">TALLES<span>SOUND</span> STUDIO</div>
<div class="panel">
<h1>Upload New Sample</h1>

<label>Cover Image</label>
<input type="file" accept="image/*">

<label>Audio File</label>
<input type="file" accept="audio/*">

<label>Sample Name</label>
<input placeholder="Dark Trap 808 Loop">

<label>Category</label>
<select>
<option>Drums</option><option>Melodies</option><option>Vocals</option><option>FX</option><option>Presets</option>
</select>

<div class="row">
<div><label>BPM</label><input placeholder="140"></div>
<div><label>Key</label><input placeholder="F#m"></div>
</div>

<label>Artist</label>
<input placeholder="AmirTalles">

<label>Description</label>
<textarea placeholder="Describe your sound..."></textarea>

<button>PUBLISH</button>
</div>
</div>
</body>
</html>
